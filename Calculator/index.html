<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <!---<meta name="viewport" content="width=device-width; initial scale=1.0">---->
        <meta description="HTML, CSS, JSS" Author="Deolawage">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css" />
    
    </head>
    <body>
        <div id="calculator-container-wrapper">

            <input id="display" readonly/>

            <div id="numbers-keys">
                     <button class="operator-btn">+</button>
        <button class="numbers-btn">7</button>
        <button class="numbers-btn">8</button>
        <button class="numbers-btn">9</button>
        <button  class="operator-btn">-</button>
        <button class="numbers-btn">6</button>
        <button class="numbers-btn">5</button>
        <button class="numbers-btn">4</button>
        <button  class="operator-btn">*</button>
        <button class="numbers-btn">3</button>
        <button class="numbers-btn">2</button>
        <button class="numbers-btn">1</button>
        <button  class="operator-btn">/</button>
        <button class="numbers-btn">0</button>
        <button id="decimal-btn">.</button>
        <button  id="equal-btn">=</button>
        <button  id="clear-btn">C</button>
         <button id="backspace-btn">B</button>
            </div>
        </div>
    </body>
    <script defer src="script.js"></script>
</html>
