<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'/>
    <title>Speaker Submission</title>
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>


<section id="container-wrapper" class="container-wrapper">

  <div id="make-work">
  <div class="side">
    <img src="sideimage.jpg" alt="Side Image">
  </div>
  <div class="positioned"> 
        <img src="odin-lined.png" alt="Odin Logo" width="50px" height="50px"> 
        <h2>ODIN</h2>
</div>


</div>
  </div>

  </div>

<div class="form-wrap-page" id="form-wrap-page">

  <div id="form-wrap-p">
  
<p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Minus laudantium ipsam voluptate molestias delectus, voluptates vel. Tenetur quasi maxime nulla?</p>
<h2>Lorem ipsum dolor sit.</h2>
  </div>


<form action="" method="get" class="form-wrap-elf" >

  <div class="flex">
<div class="form-input-flex">
  <label for="first-name">First Name</label>
   <input type="text" name="first-name" id="first-name" required />
</div>



<div class="form-input-flex">
  <label for="last-name">Last Name</label>
   <input type="text" name="last-name" id="last-name" required />
</div>

</div>


<div class="flex">
<div class="form-input-flex">
  <label for="Email">Email</label>
   <input type="email" name="Email" id="email" required />
</div>



<div class="form-input-flex">
  <label for="Phone-Number">Phone Number</label>
   <input type="number" name="Phone-Number" id="Phone-Number" required 
    pattern="\d{11}" 
    maxlength="11"
    placeholder="e.g., 08012345678"/>
</div>
</div>


<div class="flex">

<div class="form-input-flex">
  <label for="Password">Password</label>
   <input type="password" name="Password" id="Password" required minlength="4" maxlength="8"/>
</div>


<div class="form-input-flex">
  <label for="Confirmation">Confirm Password</label>
   <input type="password" name="Confrim-password" id="confirm-password" required  minlength="4" maxlength="8"/>
</div>
</div>

<div id="submit-footer">
<button type="submit">Submit</button>
<a class="Log" href="#">Already have an account?</a><a href="#" class="Log">Log in</a>
</div>
</form>

</div>

</section>


  </body>
</html>
