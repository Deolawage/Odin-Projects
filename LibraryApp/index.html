<!Doctype html>
<html>
    <head> 
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <h1>My Library</h1>

        <button id="new-book-btn">New Book</button>
        <dialog id="book-dialog">
            <form id="book-form">
                 <h2>Add a New Book</h2>

        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>

        <label for="author">Author</label>
        <input type="text" id="author" name="author" required>

        <label for="pages">Number of Pages</label>
        <input type="number" id="pages" name="pages" min="1" required>

        <label>
            <input type="checkbox" id="is-read" name="isRead">
            I've read this book
        </label>

        <div class="form-buttons">
            <button type="submit">Add Book</button>
            <button type="button" id="close-dialog">Cancel</button>
        </div>
            </form>
        </dialog>

    










      <div id="library">

      </div>


    <script src="script.js" defer></script>
</html>
