<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Toc Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="game-container">
    <h1>Tic Tac Toe</h1>

<div class="player-inputs">
    <div>
        <label for="player-one-name">Player 1</label>
        <input type="text" id="player-one-name" placeholder="Enter name">
    </div>

    <div>
        <label for="player-two-name">Player 2</label>
        <input type="text" id="player-two-name" placeholder="Enter name">
    </div>

    <button id="start-game-btn">Start Game</button>
</div>

<h2 class="turn-display"></h2>
<h2 class="result-display"></h2>

    <div class="game-board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <script src="script.js" defer></script>
    <button class="cell" data-index="8"></button>
</div>
  

<button id="restart-btn">Restart Game</button>
</div>
</body>
</html>
